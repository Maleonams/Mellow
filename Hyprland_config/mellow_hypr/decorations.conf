# Windowwwww first

### Window ###

decoration {
    rounding = 10
    rounding_power = 4
    active_opacity = 0.97
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 1
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 1.17
        noise = 0.01
        contrast = 0.8
    }
}
