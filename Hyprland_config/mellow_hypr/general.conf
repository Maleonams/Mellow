
######################
### General config ###
######################

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10
    col.active_border = rgb(ffe3A9)
    col.inactive_border = rgb(39149c)
    resize_on_border = true
    layout = dwindle
    snap {
        enabled = true
        respect_gaps = true
    }
}

### Others but still important ###

monitor = , 2560x1440@180, auto, 1

######################
### Dwindle Config ###
######################

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = true
    use_active_for_splits = true

}